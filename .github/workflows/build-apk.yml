name: Build Android APK & Windows exe

# Builds the MyTCG Android APK (Capacitor + Chaquopy) and a Windows desktop
# .exe (PyInstaller-packaged FastAPI server + webapp) on every push to main,
# and on demand via the "Run workflow" button. Each main build is stamped
# with a monotonic version and both artifacts are published together to the
# "latest" GitHub Release; installed apps poll that release (js/update.js)
# and prompt the user to download the new APK. Both files are also uploaded
# as workflow artifacts.
on:
  push:
    branches: [main]
    # Only rebuild when something that ends up in the APK or the exe changes.
    paths:
      - "mobile-apk/**"
      - "src/server/engine/**"
      - "src/server/webapp/**"
      - "src/server/api/**"
      - "src/server/services/**"
      - "src/server/main.py"
      - "src/server/model/policy_weights.json"
      - "images/color/**"
      - "tables/**"
      - "decklists/**"
      - "scripts/sync_mobile.py"
      - "scripts/desktop_app.py"
      - "scripts/make_windows_icon.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

# Needed to publish the GitHub Release the update check reads from.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Chaquopy needs a Python 3.11 interpreter on the build machine (buildPython)
      # to match the app's target version (chaquopy { version = "3.11" }).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail early if the generated mobile-apk/ tree drifted from the masters
      # under src/. Same check that tests/test_mobile_sync.py enforces.
      - name: Verify mobile tree is in sync
        run: python scripts/sync_mobile.py --check

      # Capacitor generates several files that are gitignored (see
      # mobile-apk/android/.gitignore: the capacitor-cordova-android-plugins
      # module, the copied www assets, and the capacitor config/plugins files).
      # `cap sync` recreates them from the committed www/ and native project;
      # without it Gradle fails on the missing cordova.variables.gradle.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-apk/package-lock.json

      - name: Install Capacitor CLI
        working-directory: mobile-apk
        run: npm ci

      - name: Capacitor sync
        working-directory: mobile-apk
        run: npx cap sync android

      # Capacitor 8 stamps sourceCompatibility/targetCompatibility 21 into the
      # generated capacitor.build.gradle, so the build needs JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-apk/android/**/*.gradle', 'mobile-apk/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # run_number increases with every run of this workflow, so it makes a
      # monotonic versionCode the installed app can compare against the release
      # tag (v<run_number>). versionName is human-facing.
      - name: Build debug APK
        working-directory: mobile-apk/android
        run: >-
          ./gradlew assembleDebug --no-daemon --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp mobile-apk/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/mytcg-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytcg-debug-apk
          path: dist/*.apk
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      # Base app dependencies (fastapi/uvicorn/pillow/...) plus pyinstaller,
      # pinned in uv.lock so the packaged exe matches what `uv run uvicorn
      # src.server.main:app` runs in dev.
      - name: Install dependencies
        run: uv sync --group desktop

      - name: Generate app icon
        run: uv run python scripts/make_windows_icon.py

      # --paths . puts the repo root on PyInstaller's analysis path so it can
      # follow `from src.server.main import app` (see scripts/desktop_app.py).
      # --add-data mirrors the on-disk layout the app's Path(__file__)-based
      # lookups expect (main.py, api/endpoints.py, engine/data_loader.py,
      # engine/policy.py) so REPO_ROOT/WEBAPP_DIR/model/table lookups resolve
      # the same way inside the frozen bundle as they do in the repo.
      - name: Build MyTCG.exe
        run: >-
          uv run pyinstaller --noconfirm --onefile --name MyTCG
          --icon build/icon.ico
          --paths .
          --add-data "tables;tables"
          --add-data "decklists;decklists"
          --add-data "images/color;images/color"
          --add-data "src/server/webapp;src/server/webapp"
          --add-data "src/server/model;src/server/model"
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          scripts/desktop_app.py

      - name: Stage exe
        run: |
          mkdir -p dist_release
          cp "dist/MyTCG.exe" "dist_release/mytcg-v${{ github.run_number }}.exe"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytcg-windows-exe
          path: dist_release/*.exe
          if-no-files-found: error

  release:
    needs: [build-apk, build-exe]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mytcg-debug-apk
          path: dist

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: mytcg-windows-exe
          path: dist

      # Publish the release the in-app update check polls (js/update.js finds
      # the APK by its .apk extension, so adding the .exe alongside it is
      # safe). Marked --latest so the /releases/latest API returns it.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ github.run_number }}"
          dist/*.apk dist/*.exe
          --repo "${{ github.repository }}"
          --title "MyTCG v1.0.${{ github.run_number }}"
          --notes "Automated build from ${{ github.sha }}."
          --latest
